name: Screenshots hochladen
# Lädt die gerahmten Screenshots (Branch „store-screens“) per API in alle Sprachen der Version in Vorbereitung.
# Bericht: Branch „asc-report“, report.txt.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Screenshots holen
        run: |
          git fetch -q origin store-screens
          mkdir -p /tmp/screens && git archive origin/store-screens | tar -x -C /tmp/screens
      - name: Hochladen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/key.p8"
          python3 ci/asc_screenshots.py de.koeven.meeterz /tmp/screens > /tmp/report.txt 2>&1 || echo "Exit $?" >> /tmp/report.txt
      - name: Bericht veröffentlichen
        run: |
          git config user.name "meeterz-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan asc-report
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/report.txt report.txt
          git add report.txt
          git commit -q -m "Screenshots hochladen"
          git push -f origin asc-report
