name: ASC-Status
# Zeigt die letzten TestFlight-Builds samt Verarbeitungsstatus und Upload-Fehlern (Branch "asc-report", report.txt).
on:
  workflow_dispatch:
    inputs:
      drop_cert:
        description: "Verwaistes Distributionszertifikat löschen (Anfang des Ablaufdatums, z. B. 2027-10-29T09:08)"
        default: ""

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Status abfragen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/key.p8"
          python3 ci/asc.py status de.koeven.meeterz > /tmp/report.txt 2>&1 || true
          python3 ci/asc.py certs "${{ inputs.drop_cert }}" >> /tmp/report.txt 2>&1 || true
      - name: Bericht veröffentlichen
        run: |
          git config user.name "meeterz-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan asc-report
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/report.txt report.txt
          git add report.txt
          git commit -q -m "ASC-Status"
          git push -f origin asc-report
