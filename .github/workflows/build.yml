name: Build

# Baut Meeterz für den iOS-Simulator (ohne Signierung), um Compile-Fehler ohne lokalen Mac zu finden.
# Benötigt nur das Repo-Secret MAPBOX_DOWNLOADS_TOKEN (Mapbox Secret Token mit Scope "Downloads:Read").
# Der Bericht wird auf den Branch "ci-report" geschrieben (Datei report.txt).

# Läuft nachts und auf Knopfdruck (Actions → Build → Run workflow), nicht bei jedem Push:
# Zum schnellen Ausprobieren dient der TestFlight-Workflow.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      store_screenshots:
        description: "Auf einem iPhone Pro Max laufen lassen (Screenshots in 6,9 Zoll für den App Store)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Bauen
        id: build
        continue-on-error: true
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          # Öffentliche Werte (stecken in jeder App-Datei); optional, ohne sie wird der UI-Test übersprungen
          CI_SUPABASE_REF: jgtkyxlzroajtxboqgcn
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          PREFER_MAX: ${{ inputs.store_screenshots && '1' || '0' }}
        run: ./ci/build.sh

      - name: Bericht veröffentlichen
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          cp screenshots/*.png "$RUNNER_TEMP/shots/" 2>/dev/null || true
          {
            echo "Commit: ${GITHUB_SHA}"
            echo "Zeit:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Ergebnis: ${{ steps.build.outcome }}"
            echo
            cat report.txt 2>/dev/null || echo "(kein Bericht)"
          } > /tmp/report.txt
          git config user.name "meeterz-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-report
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/report.txt report.txt
          mkdir -p screenshots
          cp -R "$RUNNER_TEMP"/shots/. screenshots/ 2>/dev/null || true
          git add report.txt screenshots
          git commit -q -m "CI-Bericht ${GITHUB_SHA}"
          git push -f origin ci-report

      - name: Ergebnis
        if: steps.build.outcome == 'failure'
        run: exit 1
