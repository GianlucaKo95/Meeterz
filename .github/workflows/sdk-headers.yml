name: SDK-Header
on: workflow_dispatch
jobs:
  headers:
    runs-on: xcode-27
    steps:
      - run: |
          H=$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/CarPlay.framework/Headers
          echo "=== CPRouteDetail"; grep -v '^ *\*\|^/\*\*\|^$\|^//' $H/CPRouteDetail.h
          echo "=== CPNavigationSession"; sed -n 100,200p $H/CPNavigationSession.h | grep -v '^$'
          echo "=== Panel types"; ls $H | grep -i panel
          for f in $H/CPMapPanel.h $H/CPMapPanelSection.h; do echo "== $f"; grep -v '^ *\*\|^/\*\*\|^$\|^//' $f; done
