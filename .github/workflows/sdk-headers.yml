name: SDK-Header
on: workflow_dispatch
jobs:
  headers:
    runs-on: xcode-27
    steps:
      - run: |
          H=$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/CarPlay.framework/Headers
          ls $H
          for f in $H/CPMapPanel*.h $H/CPPanel*.h; do echo "=== $f"; grep -v '^ *\*\|^/\*\*\|^$' $f; done
          echo "=== CPMapTemplate panel"; grep -n -i -B2 -A6 'panel' $H/CPMapTemplate.h
          echo "=== CPRouteDetail"; grep -v '^ *\*\|^/\*\*\|^$' $H/CPRouteDetail*.h || true
