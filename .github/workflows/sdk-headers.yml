name: SDK-Header
on: workflow_dispatch
jobs:
  headers:
    runs-on: xcode-27
    steps:
      - run: |
          H=$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/CarPlay.framework/Headers
          grep -rn -i 'estimate' $H | grep -v '^\s*\*' | head -80
          echo "=== CPTravelEstimates"; grep -v '^ *\*\|^/\*\*\|^$' $H/CPTravelEstimates.h
          echo "=== CPMapTemplate style"; grep -n -i 'style\|hide\|show' $H/CPMapTemplate.h | head -60
