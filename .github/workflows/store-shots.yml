name: App-Store-Screenshots
# Erfundene Daten (Testkonten Alex, Anna, Ben, Mia in Köln), echte App-Bildschirme, alle Sprachen, 6,3" und 6,9".
# Ergebnis im Branch "store-shots-raw" (Rohaufnahmen als JPEG, Bericht, Logs).
on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Sprachen"
        default: "de en fr es pt tr it"
      sizes:
        description: "Displaygrößen (pro = 6,3 Zoll, promax = 6,9 Zoll)"
        default: "pro promax"

permissions:
  contents: write

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Build-Cache laden
        uses: actions/cache@v4
        with:
          path: build/dd
          key: dd-${{ hashFiles('project.yml') }}-shots-${{ github.run_id }}
          restore-keys: |
            dd-${{ hashFiles('project.yml') }}-
            dd-
      - name: Bauen und aufnehmen
        id: build
        continue-on-error: true
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          CI_SUPABASE_REF: jgtkyxlzroajtxboqgcn
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          STORE_SHOTS: "1"
          SHOT_LANGS: ${{ inputs.langs }}
          SHOT_SIZES: ${{ inputs.sizes }}
        run: ./ci/build.sh
      - name: Ergebnis veröffentlichen (Branch store-shots-raw)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # Rohaufnahmen als JPEG (kleiner), dazu Bericht, Logs und Diagnose-Screenshots
          if [ -d storeshots ]; then
            (cd storeshots && find . -name "*.png" | while read f; do
              mkdir -p "$RUNNER_TEMP/out/storeshots/$(dirname "$f")"
              sips -s format jpeg -s formatOptions 92 "$f" --out "$RUNNER_TEMP/out/storeshots/${f%.png}.jpg" >/dev/null
            done)
          fi
          mkdir -p "$RUNNER_TEMP/out/diag"
          for f in screenshots/*.png; do [ -f "$f" ] && sips -Z 900 -s format jpeg "$f" --out "$RUNNER_TEMP/out/diag/$(basename "${f%.png}").jpg" >/dev/null; done
          cp report.txt "$RUNNER_TEMP/out/" 2>/dev/null || true
          for f in shots-*.log; do [ -f "$f" ] && tail -80 "$f" > "$RUNNER_TEMP/out/$f"; done
          git config user.name "meeterz-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan store-shots-raw
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$RUNNER_TEMP"/out/. .
          git add storeshots diag report.txt shots-*.log 2>/dev/null || git add diag report.txt
          git commit -q -m "Rohaufnahmen ${GITHUB_SHA}"
          git push -f origin store-shots-raw
      - name: Ergebnis
        if: steps.build.outcome == 'failure'
        run: exit 1
