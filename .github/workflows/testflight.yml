name: TestFlight

# Baut Meeterz als Release und lädt es zu TestFlight hoch. Nur manuell startbar.
# Voraussetzungen: bezahlter Developer-Account, App in App Store Connect angelegt,
# Secrets gesetzt – siehe docs/testflight-setup.md. Der Bericht landet auf dem Branch "testflight-report".

on:
  workflow_dispatch:
    inputs:
      carplay:
        description: "Mit CarPlay-Entitlement bauen (von Apple freigegeben)"
        type: boolean
        default: true

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Bauen und hochladen
        id: build
        continue-on-error: true
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CI_SUPABASE_REF: jgtkyxlzroajtxboqgcn
          WITH_CARPLAY: ${{ inputs.carplay && '1' || '0' }}
        run: ./ci/testflight.sh

      - name: Bericht veröffentlichen
        if: always()
        run: |
          {
            echo "Commit: ${GITHUB_SHA}"
            echo "Zeit:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Ergebnis: ${{ steps.build.outcome }}"
            echo
            cat report.txt 2>/dev/null || echo "(kein Bericht)"
          } > /tmp/report.txt
          git config user.name "meeterz-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan testflight-report
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/report.txt report.txt
          git add report.txt
          git commit -q -m "TestFlight-Bericht ${GITHUB_SHA}"
          git push -f origin testflight-report

      - name: Ergebnis
        if: steps.build.outcome == 'failure'
        run: exit 1
