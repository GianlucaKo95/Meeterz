name: Meeterz
options:
  bundleIdPrefix: de.koeven
  # Deutsch als Entwicklungssprache: Mapbox wählt Sprache für Ansagen und Beschriftungen nach den Sprachen der App
  developmentLanguage: de
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  # Navigation SDK legt die Maps-Version fest – beide müssen zusammenpassen
  MapboxNavigation:
    url: https://github.com/mapbox/mapbox-navigation-ios.git
    exactVersion: 3.32.1
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios
    exactVersion: 11.32.1

targets:
  Meeterz:
    type: application
    platform: iOS
    sources:
      - path: Meeterz
      - path: Shared
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - package: MapboxMaps
        product: MapboxMaps
      - package: MapboxNavigation
        product: MapboxNavigationCore
      - package: MapboxNavigation
        product: MapboxNavigationUIKit
      - target: MeeterzWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.koeven.meeterz
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Beides kommt aus Config.xcconfig (Personal Team / bezahlter Account / Simulator)
        CODE_SIGN_ENTITLEMENTS: $(MEETERZ_ENTITLEMENTS)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(MEETERZ_FLAGS)
    info:
      path: Meeterz/Info.plist
      properties:
        CFBundleDisplayName: Meeterz
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [location, audio, remote-notification]
        NSMicrophoneUsageDescription: "Meeterz nutzt das Mikrofon, damit du kurze Sprachschnipsel für deine Freunde aufnehmen kannst (max. 5 Sekunden)."
        NSCameraUsageDescription: "Meeterz nutzt die Kamera, damit du ein Profilfoto aufnehmen kannst, das nur deine Freunde sehen."
        NSLocationWhenInUseUsageDescription: "Meeterz zeigt deinen Standort auf der Karte, navigiert dich und teilt deinen Standort mit Freunden, die du freigegeben hast."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Damit Freunde dich auch sehen, wenn Meeterz im Hintergrund läuft (z. B. während der Fahrt)."
        NSLocationTemporaryUsageDescriptionDictionary:
          LocationAccuracyAuthorizationDescription: "Für die Navigation braucht Meeterz deinen genauen Standort."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          CPSupportsDashboardNavigationScene: true
          CPSupportsInstrumentClusterNavigationScene: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
            CPTemplateApplicationDashboardSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationDashboardScene
                UISceneConfigurationName: CarPlay-Dashboard
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlayDashboardSceneDelegate
            CPTemplateApplicationInstrumentClusterSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationInstrumentClusterScene
                UISceneConfigurationName: CarPlay-Cluster
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlayClusterSceneDelegate
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        MEETERZ_PUSH_ENV: $(MEETERZ_PUSH_ENV)

  # Live-Aktivität (Sperrbildschirm, Dynamic Island) und Widgets
  MeeterzWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MeeterzWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.koeven.meeterz.widgets
        # Gemeinsamer Schlüsselbund mit der App (Datenstand für die Widgets)
        CODE_SIGN_ENTITLEMENTS: MeeterzWidgets/MeeterzWidgets.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    info:
      path: MeeterzWidgets/Info.plist
      properties:
        CFBundleDisplayName: Meeterz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MeeterzUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MeeterzUITests
    dependencies:
      - target: Meeterz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.koeven.meeterz.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  MeeterzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeeterzTests
    dependencies:
      - target: Meeterz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.koeven.meeterz.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Meeterz.app/Meeterz"

schemes:
  Meeterz:
    build:
      targets:
        Meeterz: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MeeterzUITests
        - MeeterzTests
